name: CI

on:
  push:
    branches: '*'
  pull_request:
    branches: '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Create maps.properties
        env:
          YANDEXMAPS_SECRET: ${{ secrets.YANDEXMAPS_SECRET }}
        run: echo "$YANDEXMAPS_SECRET" > ./maps.properties

      - name: Create api.properties
        env:
          API_SECRET: ${{ secrets.API_SECRET }}
        run: echo "$API_SECRET" > ./api.properties

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/NeWork-debug-${{ github.event.pull_request.number }}.apk

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeWork-debug-${{ github.event.pull_request.number }}
          path: app/build/outputs/apk/debug/NeWork-debug-${{ github.event.pull_request.number }}.apk
          retention-days: 14